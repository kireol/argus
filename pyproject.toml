[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utf"
version = "0.1.0"
description = "Argus — Universal Cross-Platform Application Functional & Visual Testing Framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Argus Team" }]
keywords = ["testing", "visual-testing", "automation", "android", "yocto", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "numpy>=1.26",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
yocto = ["paramiko>=3.4"]
ocr = ["pytesseract>=0.3.10"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "paramiko>=3.4",
    "pytest-httpserver>=1.0",
    "types-PyYAML",
    "types-paramiko",
]
all = ["utf[yocto,ocr]"]

[project.scripts]
utf = "utf.cli.main:app"

[project.entry-points."utf.actions"]
builtin = "utf.actions.builtin:register"

[project.entry-points."utf.conditions"]
builtin = "utf.conditions.builtin:register"

[project.entry-points."utf.devices"]
builtin = "utf.adapters.registry:register_builtin_devices"

[tool.hatch.build.targets.wheel]
packages = ["src/utf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: integration tests (may be slower)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = "src"
