[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "1.2.4"
description = "Argus — Universal Cross-Platform Application Functional & Visual Testing Framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Chris Parent" }]
keywords = [
    "testing", "visual-testing", "automation", "android", "yocto", "embedded",
    "web", "browser", "playwright", "roku", "tvos", "apple-tv", "pyatv",
    "esp32", "embedded-display", "wokwi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "numpy>=1.26",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
yocto = ["paramiko>=3.4"]
ocr = ["pytesseract>=0.3.10"]
browser = ["playwright>=1.45"]
desktop = ["pyautogui>=0.9.54"]
appletv = ["pyatv>=0.14"]
esp32 = ["pyserial>=3.5", "esptool>=4.7,<6"]
mcp = ["mcp>=2.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "paramiko>=3.4",
    "pytest-httpserver>=1.0",
    "types-PyYAML",
    "types-paramiko",
    "mcp>=2.1",
]
all = ["argus[yocto,ocr,browser,desktop,appletv,esp32,mcp]"]

[project.scripts]
argus = "argus.cli.main:app"

[project.entry-points."argus.actions"]
builtin = "argus.actions.builtin:register"

[project.entry-points."argus.conditions"]
builtin = "argus.conditions.builtin:register"

[project.entry-points."argus.devices"]
builtin = "argus.adapters.registry:register_builtin_devices"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: integration tests (may be slower)",
]
filterwarnings = [
    # Production classes named Test* (TestDefinition, TestFilter...) are not test classes.
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pytesseract", "cv2", "playwright", "playwright.*", "pyatv", "pyatv.*",
    "serial", "serial.*", "esptool", "esptool.*", "pyautogui",
]
ignore_missing_imports = true
