# meta-argus-demo -- minimal layer packaging the Argus Demo pygame app
# and its systemd unit for the Argus Yocto example.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "argus-demo"
BBFILE_PATTERN_argus-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_argus-demo = "6"

LAYERSERIES_COMPAT_argus-demo = "kirkstone langdale mickledore nanbield scarthgap"

LAYERDEPENDS_argus-demo = "core"
