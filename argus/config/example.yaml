# Example environment configuration.
# Copy to your user config (see `argus init` for its location) or pass with
# `argus run --config config/example.yaml`. Secrets come from the environment.

backend:
  base_url: ${BACKEND_URL}
  token: ${BACKEND_TOKEN}

devices:

  android:
    type: android
    serial: ${ANDROID_SERIAL}
    app_package: com.example.app
    instrumentation:
      base_url: http://127.0.0.1:8085

  living_room:
    type: yocto
    host: ${YOCTO_HOST}
    username: ${YOCTO_USER}
    private_key: ${YOCTO_KEY}
    screenshot:
      command: "weston-screenshooter -f {path}"
      remote_path: /tmp/utf_screenshot.png
    app:
      start: "systemctl start myapp"
      stop: "systemctl stop myapp"
      process: "myapp"
    instrumentation:
      base_url: http://${YOCTO_HOST}:8085

regions:
  movie_artwork:
    x: 100
    y: 100
    width: 500
    height: 400
  movie_title:
    x: 600
    y: 100
    width: 700
    height: 100

# MCP server for AI clients (`argus mcp`; see docs/mcp.md). Optional dependency:
# pip install "argus[mcp]". Flags such as --transport/--host/--port override these.
# mcp:
#   transport: stdio            # stdio | streamable-http
#   host: 127.0.0.1
#   port: 8000
#   auth:
#     tokens: ["${ARGUS_MCP_TOKEN}"]   # required to bind to a non-loopback host
#   limits:
#     max_concurrent_runs: 1
