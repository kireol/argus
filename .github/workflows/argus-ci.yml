# Exercises the repository's own GitHub Action end to end (spec §48):
# successful run, test failure, configuration failure, artifact generation,
# job summary, and exit-code propagation — all against the fake adapters.
name: Argus CI action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit + CI-layer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e "./argus[dev]"
      - run: python -m pytest tests/ci tests/unit/test_github_action.py -q
        working-directory: argus

  creator-unit:
    name: Test Creator unit tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest-qt imports PySide6 at configure time, which needs the Qt
      # platform libraries even with QT_QPA_PLATFORM=offscreen.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -q -e "./argus-test-creator[dev]"
      - run: python -m pytest tests/unit -q
        working-directory: argus-test-creator

  action-success:
    name: Action — successful run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: argus
        uses: ./
        with:
          working-directory: argus
          config: examples/ci/argus-ci.yml
          suite: pr
          artifact-name: argus-results-success
      # $GITHUB_STEP_SUMMARY is a different file in every step, so the
      # summary written by the action is checked through Argus's own log.
      - name: Verify outputs and artifacts
        run: |
          test "${{ steps.argus.outputs.status }}" = "passed"
          test "${{ steps.argus.outputs.exit-code }}" = "0"
          test "${{ steps.argus.outputs.output-dir }}" = "$GITHUB_WORKSPACE/argus/argus-results"
          test -f "${{ steps.argus.outputs.report-json }}"
          test -f "${{ steps.argus.outputs.junit-xml }}"
          test -f "${{ steps.argus.outputs.report-html }}"
          test -f argus/argus-results/metadata/ci.json
          grep -q "GitHub job summary written" argus/argus-results/logs/argus/argus.log

  action-test-failure:
    name: Action — test failure propagates exit code 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add a failing test
        run: |
          mkdir -p /tmp/argus-fail
          cat > /tmp/argus-fail/config.yml <<'YAML'
          extends: ${{ github.workspace }}/argus/config/fake.yaml
          test_paths: [/tmp/argus-fail/tests]
          YAML
          mkdir -p /tmp/argus-fail/tests
          cat > /tmp/argus-fail/tests/fail.yaml <<'YAML'
          tests:
            - id: FAIL-001
              name: Deliberate visual failure
              feature: Failing
              platforms: [android]
              steps:
                - action: backend.set
                  data: {movieId: 123}
                - action: verify
                  condition: {type: image_present, image: movie_456.png}
          YAML
      - id: argus
        uses: ./
        continue-on-error: true
        with:
          working-directory: argus   # fake.yaml's assets/images is cwd-relative
          config: /tmp/argus-fail/config.yml
          artifact-name: argus-results-failure
      - name: Verify exit code, status, and annotations
        run: |
          test "${{ steps.argus.outcome }}" = "failure"
          test "${{ steps.argus.outputs.exit-code }}" = "1"
          test "${{ steps.argus.outputs.status }}" = "failed"
          test -f argus/argus-results/tests/FAIL-001_android/actual.png
          grep -q "FAIL-001" "${{ steps.argus.outputs.report-json }}"
          grep -q "GitHub job summary written" argus/argus-results/logs/argus/argus.log

  action-config-failure:
    name: Action — configuration failure propagates exit code 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: argus
        uses: ./
        continue-on-error: true
        with:
          working-directory: argus
          config: examples/ci/argus-ci.yml
          suite: does-not-exist
          upload-artifacts: false
      - run: |
          test "${{ steps.argus.outcome }}" = "failure"
          test "${{ steps.argus.outputs.exit-code }}" = "2"
